name: chronoq-prod

# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# nginx is the sole public entry point: it serves the built SPA and reverse-
# proxies /api, /admin, /static and /ws to the (internal-only) django service.

x-django-common: &django-common
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: prod
  image: chronoq-backend:prod
  env_file: .env.prod
  restart: unless-stopped
  volumes:
    - prometheus_multiproc:/app/prometheus_multiproc
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - chronoq-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chronoq-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chronoq-net

  # One-shot: run migrations once, then exit 0.
  migrate:
    <<: *django-common
    restart: "no"
    entrypoint: []
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django:
    <<: *django-common
    command: ["gunicorn", "chronoq.asgi:application", "-c", "gunicorn.conf.py"]
    # Internal only — reached through nginx, not published to the host.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  celery-worker:
    <<: *django-common
    command: ["celery", "-A", "chronoq", "worker", "-l", "info", "--concurrency=4"]

  celery-beat:
    <<: *django-common
    command: ["celery", "-A", "chronoq", "beat", "-l", "info"]

  # Public edge: built SPA + reverse proxy to django.
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: /api
    image: chronoq-frontend:prod
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - chronoq-net

volumes:
  postgres-data:
  redis-data:
  prometheus_multiproc:

networks:
  chronoq-net:
    driver: bridge

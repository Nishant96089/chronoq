name: chronoq-prod

# Production stack. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from dev: builds the `prod` image target (gunicorn + uvicorn,
# non-root user), no source bind mounts, restart policies, health checks, and a
# one-shot `migrate` service so web/worker/beat never race on migrations.

x-django-common: &django-common
  build:
    context: ./backend
    dockerfile: Dockerfile
    target: prod
  image: chronoq-backend:prod
  env_file: .env.prod
  restart: unless-stopped
  volumes:
    # Shared so Django's /metrics can aggregate the Celery workers' samples.
    # Owned by the non-root `chronoq` user via the image dir (see Dockerfile).
    - prometheus_multiproc:/app/prometheus_multiproc
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  networks:
    - chronoq-net

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chronoq-net

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - chronoq-net

  # One-shot: run migrations once, then exit 0. Everything else waits on this
  # completing, so N replicas can't race on schema changes.
  migrate:
    <<: *django-common
    restart: "no"
    entrypoint: []
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  django:
    <<: *django-common
    command: ["gunicorn", "chronoq.asgi:application", "-c", "gunicorn.conf.py"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  celery-worker:
    <<: *django-common
    command: ["celery", "-A", "chronoq", "worker", "-l", "info", "--concurrency=4"]

  celery-beat:
    <<: *django-common
    command: ["celery", "-A", "chronoq", "beat", "-l", "info"]

volumes:
  postgres-data:
  redis-data:
  prometheus_multiproc:

networks:
  chronoq-net:
    driver: bridge

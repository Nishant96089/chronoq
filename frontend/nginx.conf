server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Common proxy headers. nginx inheritance: a location that declares its own
    # proxy_set_header (e.g. /ws/) must re-declare all of these.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Backend (same-origin) ----
    location /api/    { proxy_pass http://django:8000; }
    location /admin/  { proxy_pass http://django:8000; }
    location /static/ { proxy_pass http://django:8000; }

    # Health passthrough for an external LB hitting the edge.
    location = /healthz { proxy_pass http://django:8000/healthz; }
    location = /readyz  { proxy_pass http://django:8000/readyz; }

    # NOTE: /metrics is intentionally NOT proxied — Prometheus scrapes django
    # directly on the internal network, so it stays off the public edge.

    # ---- WebSocket (needs the HTTP/1.1 upgrade dance) ----
    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # long-lived connections
    }

    # ---- SPA static ----
    # Hashed build assets: cache hard.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html (client-side routing).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
